[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
description = "Evidence-based employee policy agent — initial integration scaffold"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.scripts]
knowledge-agent = "knowledge_agent.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
  "smoke: minimal startup and execution checks within the selected scope",
  "live: explicitly enabled real API calls (requires credentials)",
  "contract: input/output protocols and component contracts",
  "business: business behavior within the selected scope, not necessarily full E2E",
  "boundary: limits, deadlines, cancellation and recovery boundaries",
]
